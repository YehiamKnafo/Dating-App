plugins {
    id 'application'
    id  'java'
    id 'org.openjfx.javafxplugin' version '0.1.0'
    id 'edu.sc.seis.launch4j' version '3.0.6'
    id 'org.beryx.runtime' version '2.0.1'


}
def verisonNumber = System.getenv("JAVA_DATING_APP_VERSION")
def versionType = System.getenv("VERSION_TYPE")
repositories {
    mavenCentral()
}
java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)

    }
}
javafx {
    version = "23.0.2"
    modules = [ 'javafx.base','javafx.controls', 'javafx.graphics','javafx.swing' ]
}
mainClassName = 'forrealdatingapp.App'

jar {
    archiveBaseName = "DatingApp"
//    archiveVersion = version as String // Or use the global 'version' property
    manifest {
        attributes 'Main-Class': 'forrealdatingapp.Launcher'
    }
    duplicatesStrategy = 'exclude'
    from {
        configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) }
 
    }
//    from('.') {   // <-- project root
//        include '.env'
//    }
}
//"${buildDir}/launch4j"
//def rootFolder = layout.projectDirectory;
def buildFolder = layout.buildDirectory
def jpackageOutputDir = buildFolder.dir("jpackage/DatingApp")

