plugins {
    id 'application'
    id  'java'
    id 'org.openjfx.javafxplugin' version '0.1.0'
    id 'edu.sc.seis.launch4j' version '3.0.6'


}
//JENKINS WAY
version = System.getenv("JAVA_DATING_APP_VERSION");
//LOCAL WAY
//version = "1.0.0-SNAPSHOT"

repositories {
    mavenCentral()
}
java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)

    }
}
javafx {
    version = "23.0.2"
    modules = [ 'javafx.base','javafx.controls', 'javafx.graphics','javafx.swing' ]
}
mainClassName = 'forrealdatingapp.App'

jar {
    archiveBaseName = "DatingApp"
    archiveVersion = version as String // Or use the global 'version' property
    manifest {
        attributes 'Main-Class': 'forrealdatingapp.Launcher'
    }
    duplicatesStrategy = 'exclude'
    from {
        configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) }
 
    }
//    from('.') {   // <-- project root
//        include '.env'
//    }
}
//"${buildDir}/launch4j"
def rootFolder = layout.projectDirectory;
def buildFolder = layout.buildDirectory
def launch4jOutputDir = buildFolder.dir("distributions/exeWithoutJre")

tasks.register('downloadJre') {
    doLast {
        // Define the download URL for Adoptium Temurin JRE 21 (Windows x64)
        def jreUrl = "https://github.com/adoptium/temurin21-binaries/releases/download/jdk-21.0.2%2B13/OpenJDK21U-jre_x64_windows_hotspot_21.0.2_13.zip"
        def jreZipProperty = rootFolder.file("jre.zip")
        def jreDirProperty = rootFolder.dir("jre")
        // 2. Access the actual File object using .asFile
        File jreZipFile = jreZipProperty.asFile
        File jreDir = jreDirProperty.asFile

        // Create the jre-download directory if it doesn't exist
        if (!jreDir.exists()) {
            jreDir.mkdirs()
        }

        // Download the JRE
        println "Downloading JRE from $jreUrl..."
        URI.create(jreUrl).toURL().withInputStream { input ->
            jreZipFile.withOutputStream { output ->
                output << input
            }
        }

        // Extract the JRE
        println "Extracting JRE to $jreDir..."
        copy {
            from zipTree(jreZipProperty)
            into jreDirProperty
        }

        // Clean up the zip file
        delete jreZipProperty

        println "JRE downloaded and extracted to $jreDir"
    }
}
launch4j {
    outfile = 'DatingApp.exe'
    jarTask = project.tasks.jar
    bundledJrePath = 'jre' //
    outputDir = buildFolder.dir("distributions/exeWithoutJre").get().asFile.path

}
tasks.register('zipLaunch4j', Zip) {
    dependsOn 'createExe'
    archiveFileName = "DatingApp-${version}.zip" // Custom name with version
    destinationDirectory = file(layout.buildDirectory.dir("distributions"))

    from(launch4jOutputDir) {
        include '**/*'
    }
    from(rootFolder.dir("jre/jdk-21.0.2+13-jre")) { // Include the bundled JRE
        into 'jre'
    }

    doLast {
        println "Created zip archive at ${archiveFile.get()}"
    }
}


dependencies {
    
    /* uncomment for cross-platform jar: */
runtimeOnly "org.openjfx:javafx-graphics:$javafx.version:win"
runtimeOnly "org.openjfx:javafx-graphics:$javafx.version:linux"
runtimeOnly "org.openjfx:javafx-graphics:$javafx.version:mac"
implementation 'org.openjfx:javafx-base:23.0.2'
implementation 'org.openjfx:javafx-controls:23.0.2'
implementation 'org.openjfx:javafx-graphics:23.0.2'
implementation 'org.openjfx:javafx-swing:23.0.2'
implementation 'com.adobe.xmp:xmpcore:6.1.11'
implementation 'com.drewnoakes:metadata-extractor:2.19.0'
implementation 'io.github.cdimascio:dotenv-java:3.2.0'
implementation 'com.fasterxml.jackson.core:jackson-annotations:2.18.3'
implementation 'com.fasterxml.jackson.core:jackson-databind:2.18.3'
implementation 'com.fasterxml.jackson.core:jackson-core:2.18.3'
implementation 'com.cloudinary:cloudinary-http5:2.2.0'
implementation 'com.cloudinary:cloudinary-core:2.2.0'
implementation 'org.controlsfx:controlsfx:11.1.2'
implementation ('io.socket:socket.io-client:2.1.1')
implementation 'com.squareup.okhttp3:okhttp:4.12.0'
implementation 'org.slf4j:slf4j-api:2.0.17'
implementation 'org.kordamp.ikonli:ikonli-javafx:12.4.0'
implementation 'org.kordamp.ikonli:ikonli-fontawesome6-pack:12.4.0'
implementation 'org.jfxtras:jfxtras-controls:17-r1'
}

